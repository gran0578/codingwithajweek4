<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amarante&family=Oswald:wght@200..700&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Styles/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>This is a fancy title</h1>
        </header>
        <main>
            <section>
                <h3>Snow</h3>
                    <p>Snow is frozen precipitation that falls from clouds when temperatures are cold enough.</p>
                    <p>Soft, fluffy snowflakes can turn familiar landscapes into quiet winter scenes.</p>
            </section>
            <section>
                <!-- embedding external resources like videos and maps / width and height can be changed within CSS -->
                 <iframe width="560" height="315" src="https://www.youtube.com/embed/TKsDEZJYpT8?si=SAJFEmjzy1kJLhk2" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </section>
            <section>
                <iframe class="maps" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2668.902083347852!2d-75.76052633850739!3d45.34901109099685!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4cce0718cc4a6ad7%3A0xc6cc467725843e2b!2sAlgonquin%20College%20-%20Ottawa%20Campus!5e1!3m2!1sen!2sca!4v1795541832968!5m2!1sen!2sca" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>
        </main>
    </div>

</body>
</html>
